# Render Blueprint — one-click deploy (managed PostgreSQL + web service).
# In Render: New → Blueprint → connect this repo. Secrets are generated
# automatically; after the first deploy set CORS_ORIGIN to your app's URL.

databases:
  - name: nexus-db
    databaseName: nexus
    user: nexus
    plan: basic-256mb

services:
  - type: redis
    name: nexus-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: nexus-sports-medicine
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Managed Postgres connection string, injected by Render.
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      # Managed Redis connection string, injected by Render — backs the
      # BullMQ ingestion queue shared with the nexus-worker service.
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexus-redis
          property: connectionString
      # Strong secrets generated by Render on first deploy.
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Set to your Render URL after the first deploy,
      # e.g. https://nexus-sports-medicine.onrender.com
      - key: CORS_ORIGIN
        value: https://REPLACE-WITH-YOUR-RENDER-URL.onrender.com
      # Optional — enables Gemini LLM summaries. Leave unset for deterministic mode.
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: nexus-uploads
      mountPath: /app/uploads
      sizeGB: 1

  # Asynchronous ingestion worker (Phase 3): consumes the BullMQ queue that
  # nexus-sports-medicine enqueues report uploads onto. Same image/codebase,
  # different process — not a separate microservice.
  #
  # ⚠ KNOWN LIMITATION: Render disks cannot be attached to more than one
  # service, so this worker does NOT share the web service's `nexus-uploads`
  # disk — it cannot read files the web service wrote to local disk. Until
  # Phase 2 (S3-compatible object storage) replaces local disk as the upload
  # backing store, do not enable this service on Render; asynchronous
  # ingestion is fully functional today only via docker-compose (shared
  # volume) or a single-host deployment. Tracked as a launch blocker in
  # ENGINEERING_READINESS.md.
  - type: worker
    name: nexus-ingestion-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: "sh -c 'npx prisma migrate deploy && npm run start:worker'"
    plan: starter
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexus-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
