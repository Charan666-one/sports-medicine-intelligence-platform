# Render Blueprint — one-click deploy.
# In Render: New → Blueprint → connect this repo. Secrets are generated
# automatically; after the first deploy set CORS_ORIGIN to your app's URL.
services:
  - type: web
    name: nexus-sports-medicine
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # SQLite database on the persistent disk (see `disk` below).
      - key: DATABASE_URL
        value: file:/app/data/prod.db
      # Strong secrets generated by Render on first deploy.
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Set this to your Render URL after the first deploy,
      # e.g. https://nexus-sports-medicine.onrender.com
      - key: CORS_ORIGIN
        value: https://REPLACE-WITH-YOUR-RENDER-URL.onrender.com
      # Optional — enables Gemini LLM summaries. Leave unset for deterministic mode.
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: nexus-data
      mountPath: /app/data
      sizeGB: 1
