# Local / self-hosted deployment: app + PostgreSQL.
#
#   docker compose up -d db      # just the database (for `npm run dev`)
#   docker compose up --build    # full stack
#
# Provide strong secrets via a .env file or your orchestrator's secret store.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      POSTGRES_DB: nexus
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus -d nexus']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: 'postgresql://nexus:${POSTGRES_PASSWORD:-nexus}@db:5432/nexus?schema=public'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN e.g. https://app.example.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - app_uploads:/app/uploads
      - app_data:/app/data
    restart: unless-stopped

volumes:
  pg_data:
  app_uploads:
  app_data:
